[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "product-card-assistant"
version = "0.1.0"
description = "Черновик карточки товара для B2B-магазина КИП по данным о приборе."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "langgraph>=1.2.0",
    "openai>=3.41.0",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "uvicorn>=0.34.2",
]

[project.scripts]
product-card-assistant = "main:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/application",
    "src/bootstrap",
    "src/domain",
    "src/infrastructure",
    "src/presentation",
]
only-include = [
    "src/application",
    "src/bootstrap",
    "src/domain",
    "src/infrastructure",
    "src/presentation",
    "src/main.py",
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
